[package]
name = "yoyo-relay"
version = "0.6.0"
edition = "2021"
description = "Local multi-upstream LLM relay with account failover"
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
egui_extras = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["macros", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
tower-http = { version = "0.6", features = ["cors"] }
dirs = "5"
fs2 = "0.4"
ctrlc = "3"
armas = "0.2.2"
egui-phosphor = "0.11"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
raw-window-handle = "0.6"
boa_engine = { version = "0.22", default-features = false }
sha2 = "0.10"
hmac = "0.12"
urlencoding = "2"
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# winit compiles only the backends selected by feature flags.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Size-first release profile. Fat LTO removes cross-crate dead code, `z`
# prefers size over the small speed edge of `s`, and stripping drops symbols.
# `panic = "abort"` is intentionally not used: the runtime catches panics from
# the gateway task with `catch_unwind` to keep the UI alive.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 1
debug = 1
